<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" width="800" height="340" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.t{fill:#1f8f85}.m{fill:#d946ef}.w{fill:#fff}.l{fill:#c3dedb}
.ts{fill:none;stroke:#1f8f85;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ms{fill:none;stroke:#d946ef;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
*{transform-box:fill-box}
.rise{animation:rise 5s ease-in infinite;animation-delay:var(--d)}
@keyframes rise{0%{translate:0 30px;opacity:0;scale:.5}20%{opacity:1;scale:1}100%{translate:0 -110px;opacity:0}}
.pop{animation:pop 4s ease-in-out infinite;animation-delay:var(--d);transform-origin:center bottom}
@keyframes pop{0%,10%{scale:0}20%,80%{scale:1}92%,100%{scale:0}}
.scan{animation:scan 6s ease-in-out infinite}
@keyframes scan{0%,100%{translate:0 0}35%{translate:70px 14px}70%{translate:20px 36px}}
.row{animation:glow 6s ease-in-out infinite;animation-delay:var(--d)}
@keyframes glow{0%,100%{opacity:.35}40%{opacity:1}}
.bar{transform-origin:bottom;animation:grow 5s cubic-bezier(.3,1.2,.4,1) infinite;animation-delay:var(--d)}
@keyframes grow{0%{scale:1 0}25%,85%{scale:1 1}100%{scale:1 0}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 5s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:1}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
.spin{animation:spin 9s linear infinite}.spin2{animation:spin 6s linear infinite reverse}
@keyframes spin{to{rotate:360deg}}
.bob{animation:bob 3s ease-in-out infinite;animation-delay:var(--d)}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -12px}}
.cur{animation:cur 5s ease-in-out infinite}
@keyframes cur{0%{translate:70px 50px}35%,50%{translate:0 0}85%,100%{translate:70px 50px}}
.rip{transform-origin:center;animation:rip 5s ease-out infinite}
@keyframes rip{0%,38%{scale:0;opacity:0}40%{opacity:.8}60%,100%{scale:3;opacity:0}}
.coin{animation:rise 5s ease-out infinite;animation-delay:var(--d)}
.blk{animation:pop 6s cubic-bezier(.2,.9,.3,1) infinite;animation-delay:var(--d);transform-origin:left center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.bar,.pop,.blk{scale:1}.draw{stroke-dashoffset:0}}
</style><rect class="t" x="60" y="30" width="130" height="80" rx="12" style="opacity:.7"/><rect class="w" x="74" y="44" width="70" height="8" rx="4" opacity=".85"/><rect class="w" x="74" y="62" width="100" height="8" rx="4" opacity=".6"/><rect class="m" x="74" y="86" width="44" height="14" rx="7"/>
<rect class="l" x="215" y="50" width="120" height="70" rx="12" style="opacity:.8"/>
<circle class="m rip" cx="96" cy="93" r="8"/>
<g class="cur"><path class="w" stroke="#17283a" stroke-width="2" d="M96 93 l0 24 l7-6 l6 12 l6-3 l-6-12 l9 0z"/></g>
<circle class="t coin" cx="240" cy="130" r="10" style="--d:1.9s"/><circle class="m coin" cx="280" cy="130" r="10" style="--d:2.2s"/><circle class="t coin" cx="320" cy="130" r="10" style="--d:2.5s"/></svg>